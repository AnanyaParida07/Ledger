<app-auth-layout title="Change your password" subtitle="Choose a new password to continue to your workspace.">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      <small class="error" *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.invalid">Use at least 8 characters.</small>
    </label>
    <label class="field">
      <span>Confirm new password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
    </label>
    <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
    <button type="submit" class="btn-primary" [disabled]="isSubmitting()">{{ isSubmitting() ? 'Saving…' : 'Change password' }}</button>
  </form>
</app-auth-layout>
