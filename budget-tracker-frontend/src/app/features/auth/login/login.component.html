<app-auth-layout title="Welcome back" subtitle="Log in to your workspace">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="[email protected]" />
      <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
        Enter a valid email address.
      </small>
    </label>

    <label class="field">
      <span>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
      <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        Password is required.
      </small>
    </label>

    <p class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>

    <button type="submit" class="btn-primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p class="switch-link">New workspace? <a routerLink="/register">Create one</a></p>
</app-auth-layout>
