server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/budgettracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:an1234}
  jpa:
    hibernate:
      ddl-auto: update   # fine for a portfolio project; use Flyway/Liquibase for anything real
    properties:
      hibernate:
        format_sql: true
    open-in-view: true   # keeps the Session alive for the whole request - required for the tenant filter approach below
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

app:
  mail:
    from: ${MAIL_FROM:no-reply@ledger.local}
  jwt:
    # Supply a private random key through JWT_SECRET when deploying.
    secret: ${JWT_SECRET:Q62Ea4lu8mhDe6sUaVZR5YgEsj36lrNGsILvi7NDGA=}
    access-token-expiration-ms: 900000      # 15 minutes
    refresh-token-expiration-ms: 604800000  # 7 days

logging:
  level:
    org.hibernate.SQL: debug
